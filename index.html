<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>綠色物流互動實驗室</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* 視覺風格：可愛、圓潤、自然留白 */
        :root {
            --primary: #7FA98C; /* 更明亮可愛的薄荷綠/植物綠 */
            --secondary: #A3B59D; 
            --bg-color: #F8F9F5; /* 溫暖的米色底 */
            --text-main: #4A574E; 
            --text-light: #899A8F;
            --white: #FFFFFF;
            --card-radius: 35px; /* 超大圓角，增加可愛感 */
            --btn-radius: 50px;
        }

        * {
            box-sizing: border-box;
            /* 使用支援圓潤感的字體堆疊 */
            font-family: 'Nunito', 'Varela Round', 'Noto Sans TC', '微軟正黑體', sans-serif;
            margin: 0;
            padding: 0;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.7;
            letter-spacing: 0.5px;
        }

        /* 導覽列 */
        header {
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid rgba(127, 169, 140, 0.1);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        nav a {
            text-decoration: none;
            color: var(--text-light);
            margin-left: 2rem;
            font-size: 1rem;
            font-weight: 600;
            padding: 0.5rem 1rem;
            border-radius: 20px;
        }

        nav a:hover {
            color: var(--primary);
            background-color: #F0F4F1;
        }

        /* 主視覺區 */
        .hero {
            padding: 6rem 5%;
            text-align: center;
            background: radial-gradient(circle at center, #FFFFFF 0%, var(--bg-color) 100%);
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: var(--primary);
        }

        .hero p {
            font-size: 1.15rem;
            color: var(--text-light);
            max-width: 600px;
            margin: 0 auto 3rem auto;
        }

        .btn-primary {
            background-color: var(--primary);
            color: var(--white);
            padding: 1rem 3rem;
            border-radius: var(--btn-radius);
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            box-shadow: 0 8px 25px rgba(127, 169, 140, 0.3);
            display: inline-block;
        }

        .btn-primary:hover {
            background-color: #6a9176;
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 30px rgba(127, 169, 140, 0.4);
        }

        /* 內容區塊共用 */
        .section {
            padding: 5rem 5%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 3.5rem;
            color: var(--primary);
            position: relative;
        }

        /* 包材百科卡片 (動態生成) */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 2.5rem;
        }

        .card {
            background: var(--white);
            padding: 3rem 2rem;
            border-radius: var(--card-radius);
            text-align: center;
            box-shadow: 0 10px 30px rgba(127, 169, 140, 0.08);
            border: 3px solid transparent;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: var(--primary);
            box-shadow: 0 15px 40px rgba(127, 169, 140, 0.15);
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            background: #F0F4F1;
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .badge {
            background-color: var(--primary);
            color: var(--white);
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 1rem;
        }

        .card h3 {
            margin-bottom: 0.8rem;
            font-weight: 700;
            font-size: 1.4rem;
        }

        /* 互動面板 (模擬器 & 計算機) */
        .panel {
            background: var(--white);
            padding: 4rem;
            border-radius: var(--card-radius);
            box-shadow: 0 10px 40px rgba(127, 169, 140, 0.08);
            max-width: 800px;
            margin: 0 auto;
        }

        /* 圓圓滑桿 */
        .slider-group {
            margin-bottom: 2.5rem;
        }

        .slider-group label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-weight: 700;
            font-size: 1.1rem;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: #E8ECE6;
            height: 12px;
            border-radius: 10px;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(127, 169, 140, 0.3);
            border: 3px solid var(--white);
        }

        .result-box {
            background-color: #F0F4F1;
            padding: 2.5rem;
            border-radius: 30px;
            margin-top: 3rem;
            display: flex;
            justify-content: space-around;
            text-align: center;
        }

        .result-item p {
            color: var(--text-light);
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }

        .result-item h4 {
            font-size: 2.2rem;
            color: var(--primary);
            font-weight: 700;
        }

        /* 輸入框 */
        .input-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        input[type=number] {
            flex: 1;
            padding: 1.2rem 2rem;
            border: 2px solid #E8ECE6;
            border-radius: var(--btn-radius);
            font-size: 1.1rem;
            outline: none;
            color: var(--text-main);
            background-color: #FAFAFA;
            font-family: inherit;
        }

        input[type=number]:focus {
            border-color: var(--primary);
            background-color: var(--white);
        }

        .btn-secondary {
            background-color: var(--secondary);
            color: var(--white);
            padding: 1.2rem 2.5rem;
            border-radius: var(--btn-radius);
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .btn-secondary:hover {
            background-color: var(--primary);
        }

        /* --- 彈出視窗 Modal 樣式 --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(74, 87, 78, 0.4);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--white);
            width: 90%;
            max-width: 500px;
            padding: 3rem;
            border-radius: var(--card-radius);
            position: relative;
            transform: translateY(30px) scale(0.95);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0) scale(1);
        }

        .close-btn {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: #F0F4F1;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.2rem;
            color: var(--text-main);
            cursor: pointer;
        }
        
        .close-btn:hover {
            background: var(--primary);
            color: var(--white);
        }

        .modal-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .modal-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 1.5rem;
        }

        .data-box {
            background: #F0F4F1;
            padding: 1.5rem;
            border-radius: 20px;
            margin-bottom: 1.5rem;
            text-align: left;
        }
