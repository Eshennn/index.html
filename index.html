<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>綠色物流互動實驗室</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FAF8F5; /* 暖米色底 */
            --primary-color: #8BA888; /* 柔和的鼠尾草綠 */
            --accent-color: #D4E0CE; /* 淺薄荷綠 */
            --text-dark: #4A5D4E; /* 墨綠色 */
            --text-light: #8E9F91;
            --white: #FFFFFF;
            --radius-lg: 40px;
            --radius-md: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Zen Maru Gothic', '微軟正黑體', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            line-height: 1.8;
            letter-spacing: 0.05em;
        }

        /* 導覽列 */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5vw;
            background-color: rgba(250, 248, 245, 0.9);
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-color);
        }

        /* 標題區塊 */
        .hero-section {
            text-align: center;
            padding: 80px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero-section h1 {
            font-size: 42px;
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        .hero-section p {
            font-size: 18px;
            color: var(--text-light);
        }

        /* 內容區塊共用 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        .section-title {
            text-align: center;
            font-size: 32px;
            margin-bottom: 30px;
            color: var(--primary-color);
            font-weight: 700;
        }

        /* 分類按鈕 (Tabs) */
        .filter-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--white);
            color: var(--text-light);
            border: 2px solid transparent;
            padding: 10px 25px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(139, 168, 136, 0.05);
        }

        .filter-btn:hover {
            color: var(--primary-color);
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background: var(--primary-color);
            color: var(--white);
            box-shadow: 0 6px 20px rgba(139, 168, 136, 0.2);
        }

        /* 包材圖鑑網格 */
        .materials-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 30px;
        }

        .material-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 40px 25px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(139, 168, 136, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 2px solid transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .material-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-color);
            box-shadow: 0 15px 40px rgba(139, 168, 136, 0.15);
        }

        .card-emoji {
            font-size: 50px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--accent-color);
            width: 100px;
            height: 100px;
            border-radius: 50%;
        }

        .card-type {
            font-size: 13px;
            background: var(--bg-color);
            color: var(--primary-color);
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .card-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .card-subtitle {
            font-size: 14px;
            color: var(--text-light);
            line-height: 1.5;
        }

        /* 彈出視窗 (Modal) */
        .modal-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(74, 93, 78, 0.3);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 999;
        }

        .modal-bg.show {
            opacity: 1;
            visibility: visible;
        }

        .modal-box {
            background: var(--white);
            width: 90%;
            max-width: 450px;
            border-radius: var(--radius-lg);
            padding: 40px;
            text-align: center;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-bg.show .modal-box {
            transform: scale(1);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--bg-color);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            color: var(--text-dark);
            transition: 0.3s;
        }
        
        .close-btn:hover {
            background: var(--primary-color);
            color: var(--white);
        }

        .modal-data {
            background: var(--bg-color);
            padding: 20px;
            border-radius: var(--radius-md);
            margin: 20px 0;
            text-align: left;
        }

        .data-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            border-bottom: 1px dashed var(--accent-color);
            padding-bottom: 10px;
        }
        
        .data-line:last-child {
            margin-bottom: 0; border-bottom: none; padding-bottom: 0;
        }
    </style>
</head>
