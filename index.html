<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>綠色物流互動教材</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f1f5f9; }
        .page-content { display: none; }
        .page-content.active { display: block !important; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        /* 導覽按鈕 */
        .nav-btn { cursor: pointer; transition: 0.3s; padding: 12px 24px; border-radius: 16px; font-weight: bold; color: #64748b; }
        .nav-btn.active { background: #059669; color: white; box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3); }

        /* 滑桿樣式 */
        .slider { -webkit-appearance: none; width: 100%; height: 10px; border-radius: 5px; background: #e2e8f0; outline: none; }
        .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: #059669; cursor: pointer; border: 3px solid white; box-shadow: 0 0 5px rgba(0,0,0,0.2); }

        /* 數據可視化顆粒 */
        .tree-unit { display: inline-block; animation: grow 0.5s ease-out forwards; }
        @keyframes grow { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* 百科卡片 */
        .material-card { background: white; border-radius: 20px; padding: 20px; text-align: center; border: 2px solid transparent; transition: 0.3s; cursor: pointer; }
        .material-card:hover { border-color: #10b981; transform: translateY(-5px); }
    </style>
</head>
<body>

    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-50 py-4 border-b">
        <div class="max-w-6xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 bg-green-600 rounded-xl flex items-center justify-center text-white shadow-lg">
                    <i class="fa-solid fa-leaf"></i>
                </div>
                <span class="font-black text-2xl tracking-tighter text-slate-800">綠色物流實驗室</span>
            </div>
            <nav class="flex gap-1 bg-slate-200/50 p-1 rounded-2xl">
                <button onclick="showPage('compare')" id="btn-compare" class="nav-btn active">包材百科</button>
                <button onclick="showPage('balance')" id="btn-balance" class="nav-btn">策略模擬</button>
                <button onclick="showPage('carbon')" id="btn-carbon" class="nav-btn">減碳計算</button>
                <button onclick="showPage('test')" id="btn-test" class="nav-btn">挑戰賽</button>
            </nav>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-12">

        <!-- [區塊一：包材百科] -->
        <section id="page-compare" class="page-content active">
            <div class="mb-10 flex flex-col md:flex-row justify-between items-end gap-4">
                <div>
                    <h2 class="text-3xl font-black text-slate-800">包材顯微鏡</h2>
                    <p class="text-slate-500">點擊不同包材，探索它們的物理特性與環保價值</p>
                </div>
                <div class="flex gap-2">
                    <button onclick="filterCat('all')" class="px-4 py-2 rounded-full bg-slate-800 text-white text-sm font-bold">全部</button>
                    <button onclick="filterCat('high')" class="px-4 py-2 rounded-full bg-white text-slate-600 border text-sm font-bold hover:bg-slate-50">防護型</button>
                    <button onclick="filterCat('low')" class="px-4 py-2 rounded-full bg-white text-slate-600 border text-sm font-bold hover:bg-slate-50">經濟型</button>
                </div>
            </div>
            
            <div class="grid grid-cols-2 md:grid-cols-4 gap-6" id="grid-container">
                <!-- 這裡保留你原本的 8 種包材數據，僅強化 UI 結構 -->
                <div class="material-card shadow-sm" data-cat="high" onclick="openInfo('蜂巢紙')">
                    <div class="text-4xl mb-3">🐝</div>
                    <div class="font-black text-slate-700">FSC 蜂巢紙</div>
                    <div class="text-xs text-green-600 font-bold mt-2">防震首選</div>
                </div>
                <div class="material-card shadow-sm" data-cat="high" onclick="openInfo('循環袋')">
                    <div class="text-4xl mb-3">♻️</div>
                    <div class="font-black text-slate-700">循環袋</div>
                    <div class="text-xs text-blue-600 font-bold mt-2">重複使用</div>
                </div>
                <!-- ...其餘 6 種以此類推 (略，請保留原本清單內容) -->
            </div>

            <!-- 浮動詳解區 (不再只是彈窗，而是側邊滑出或下方展開) -->
            <div id="detail-panel" class="hidden mt-8 bg-green-900 text-white p-8 rounded-[2.5rem] shadow-2xl relative overflow-hidden">
                <div class="relative z-10 flex flex-col md:flex-row gap-8 items-center">
                    <div id="detail-icon" class="text-7xl"></div>
                    <div>
                        <h3 id="detail-title" class="text-3xl font-black mb-2"></h3>
                        <p id="detail-desc" class="text-green-100 leading-relaxed max-w-2xl"></p>
                        <div class="mt-6 flex gap-4">
                            <span class="px-4 py-2 bg-white/20 rounded-lg text-sm font-bold">成本：<span id="detail-price"></span></span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- [區塊二：策略模擬器 - 高度互動版] -->
        <section id="page-balance" class="page-content">
            <div class="grid lg:grid-cols-2 gap-12 items-center">
                <div class="space-y-8">
                    <div>
                        <h2 class="text-4xl font-black text-slate-800 mb-2">出貨策略配比</h2>
                        <p class="text-slate-500">調整你的經營傾向，看看包材組合會如何變化</p>
                    </div>

                    <div class="bg-white p-8 rounded-3xl shadow-xl space-y-10">
                        <!-- 互動滑桿 1 -->
                        <div class="space-y-4">
                            <div class="flex justify-between font-black">
                                <span class="text-slate-600"><i class="fa-solid fa-wallet mr-2"></i>預算投入</span>
                                <span id="val-budget" class="text-green-600">$ 50</span>
                            </div>
                            <input type="range" min="0" max="100" value="50" class="slider" id="input-budget" oninput="simStrategy()">
                            <div class="flex justify-between text-xs text-slate-400 font-bold"><span>極簡省錢</span><span>豪華包裝</span></div>
                        </div>

                        <!-- 互動滑桿 2 -->
                        <div class="space-y-4">
                            <div class="flex justify-between font-black">
                                <span class="text-slate-600"><i class="fa-solid fa-earth-asia mr-2"></i>環保堅持</span>
                                <span id="val-eco" class="text-green-600">50%</span>
                            </div>
                            <input type="range" min="0" max="100" value="50" class="slider" id="input-eco" oninput="simStrategy()">
                            <div class="flex justify-between text-xs text-slate-400 font-bold"><span>傳統塑料</span><span>100% 零廢棄</span></div>
                        </div>
                    </div>
                </div>

                <div class="bg-slate-800 p-10 rounded-[3.5rem] shadow-2xl text-white h-[500px] flex flex-col">
                    <h4 class="text-xl font-bold mb-6 text-green-400"><i class="fa-solid fa-robot mr-2"></i>AI 建議配置方案</h4>
                    <div id="sim-result" class="flex-1 space-y-4">
                        <!-- 動態生成建議內容 -->
                    </div>
                    <div class="mt-6 pt-6 border-t border-slate-700">
                        <div class="flex justify-between items-center text-sm">
                            <span class="opacity-60">預估顧客滿意度</span>
                            <div class="w-32 h-2 bg-slate-700 rounded-full overflow-hidden">
                                <div id="satisfaction-bar" class="h-full bg-yellow-400 transition-all duration-500" style="width: 50%;"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- [區塊三：減碳數據 - 可視化版] -->
        <section id="page-carbon" class="page-content">
            <div class="text-center max-w-2xl mx-auto mb-12">
                <h2 class="text-4xl font-black text-slate-800 mb-4">減碳成果具象化</h2>
                <p class="text-slate-500 italic">當你改用環保包材，對地球的影響究竟是什麼樣子？輸入你的預計出貨量試試看。</p>
            </div>

            <div class="bg-white p-10 rounded-[3rem] shadow-xl border-4 border-green-100 flex flex-col md:flex-row gap-12 items-center">
                <div class="w-full md:w-1/3">
                    <label class="block text-sm font-black text-slate-500 mb-4 uppercase tracking-widest">輸入年度出貨件數</label>
                    <input type="number" id="carbon-input" value="100" oninput="visualizeCarbon()" 
                           class="w-full text-5xl font-black text-green-600 bg-transparent border-b-4 border-green-200 focus:outline-none focus:border-green-500 pb-2">
                    <p class="text-xs text-slate-400 mt-4 font-bold">根據台灣電商平均數據計算</p>
                </div>
                
                <div class="flex-1 w-full bg-slate-50 p-8 rounded-[2rem] min-h-[300px]">
                    <div class="flex justify-between items-center mb-6">
                        <span class="font-black text-slate-700">🌲 等同於種植林：</span>
                        <span id="tree-count-num" class="text-3xl font-black text-green-600">1 棵樹</span>
                    </div>
                    <div id="tree-visualizer" class="flex flex-wrap gap-3 text-4xl leading-none">
                        <!-- 動態生成樹木圖示 -->
                        <span class="tree-unit">🌳</span>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <script>
        // 頁面切換邏輯
        function showPage(pageId) {
            document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + pageId).classList.add('active');
            if(pageId === 'balance') simStrategy();
        }

        // --- 百科交互邏輯 ---
        const materialData = {
            '蜂巢紙': { icon: '🐝', desc: '幾何受力結構，完美取代塑膠氣泡墊，且拉開後體積增加 20 倍，極省倉儲空間。', price: '中價位' },
            '循環袋': { icon: '♻️', desc: '可回收再利用達 50 次，只要 3 次循環即可抵銷製作時產生的碳排。', price: '單次租賃低' }
            // 可在此補齊其他 6 種
        };
        function openInfo(name) {
            const d = materialData[name];
            const panel = document.getElementById('detail-panel');
            panel.classList.remove('hidden');
            document.getElementById('detail-title').innerText = name;
            document.getElementById('detail-icon').innerText = d.icon;
            document.getElementById('detail-desc').innerText = d.desc;
            document.getElementById('detail-price').innerText = d.price;
            panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // --- 策略模擬器核心邏輯 ---
        function simStrategy() {
            const budget = parseInt(document.getElementById('input-budget').value);
            const eco = parseInt(document.getElementById('input-eco').value);
            
            document.getElementById('val-budget').innerText = `$ ${budget}`;
            document.getElementById('val-eco').innerText = `${eco}%`;

            let resultHTML = "";
            let satisfaction = 50;

            if (eco > 70 && budget > 70) {
                resultHTML = buildItem("🐝 FSC 蜂巢紙", "高保護且環保") + buildItem("🩹 水性膠帶", "完全回收不脫膠") + buildItem("🎨 大豆油墨印刷", "質感與永續兼具");
                satisfaction = 95;
            } else if (eco > 70 && budget <= 70) {
                resultHTML = buildItem("♻️ 循環袋", "極致減塑") + buildItem("📠 廢紙箱再製機", "將廢料轉為緩衝材");
                satisfaction = 80;
            } else if (eco <= 70 && budget > 70) {
                resultHTML = buildItem("📦 雙層瓦楞紙箱", "最強防摔") + buildItem("🫧 氣泡袋", "傳統但穩定");
                satisfaction = 85;
            } else {
                resultHTML = buildItem("✉️ 普通塑膠快遞袋", "成本極致化") + buildItem("🌫️ 填充塑膠", "基礎緩衝");
                satisfaction = 40;
            }

            document.getElementById('sim-result').innerHTML = resultHTML;
            document.getElementById('satisfaction-bar').style.width = satisfaction + "%";
        }
        function buildItem(name, sub) {
            return `<div class="bg-slate-700/50 p-4 rounded-2xl border border-slate-600 animate-slideUp">
                        <div class="font-black text-green-400">${name}</div>
                        <div class="text-xs text-slate-400">${sub}</div>
                    </div>`;
        }

        // --- 減碳可視化邏輯 ---
        function visualizeCarbon() {
            const input = document.getElementById('carbon-input').value;
            const treeVisualizer = document.getElementById('tree-visualizer');
            const countNum = document.getElementById('tree-count-num');
            
            // 換算率：大約 100 件環保出貨 = 0.1 棵樹 (簡化假設)
            const treeCount = Math.max(1, Math.floor(input / 100));
            
            countNum.innerText = `${treeCount} 棵樹`;
            
            let icons = "";
            for(let i=0; i < Math.min(treeCount, 100); i++) { // 上限 100 避免網頁當掉
                icons += `<span class="tree-unit">🌳</span>`;
            }
            if(treeCount > 100) icons += `<span class="text-sm text-slate-400">+ ${treeCount-100} ...</span>`;
            
            treeVisualizer.innerHTML = icons;
        }

        // 初始執行
        window.onload = () => { visualizeCarbon(); };
    </script>
</body>
</html>
